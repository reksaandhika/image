<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Squoosh</title>
    <meta
      name="description"
      content="Squoosh is the ultimate image optimizer that allows you to compress and compare images with different codecs in your browser."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@SquooshApp" />
    <meta property="og:title" content="Squoosh" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://squoosh.app/icon-large-maskable.png" />
    <meta property="og:image:secure_url" content="https://squoosh.app/icon-large-maskable.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="500" />
    <meta property="og:image:height" content="500" />
    <meta
      property="og:image:alt"
      content="A cartoon of a hand squeezing an image file on a dark background."
    />
    <meta
      name="og:description"
      content="Squoosh is the ultimate image optimizer that allows you to compress and compare images with different codecs in your browser."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-large-maskable.png" />
    <meta name="theme-color" content="#ff3385" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://squoosh.app" />
    <style>
      button,
      a,
      img,
      input,
      select,
      textarea {
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      }

      a,
      button,
      img,
      [inert],
      .inert {
        user-select: none;
        -webkit-user-select: none;
        user-drag: none;
        -webkit-user-drag: none;
        touch-callout: none;
        -webkit-touch-callout: none;
      }

      html,
      body {
        height: 100%;
        padding: 0;
        margin: 0;
        font: 12px/1.3 'HelveticaNeue-Light', 'Helvetica Neue Light',
          'Helvetica Neue', Helvetica, Arial, 'Lucida Grande', sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        contain: strict;
        background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2 2"><path d="M1 2V0h1v1H0v1z" fill-opacity=".025"/></svg>');
        background-size: 20px 20px;
      }

      #app {
        position: absolute;
        left: 0;
        top: 0;
        contain: strict;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/client/initial-app/index.tsx"></script>
  </body>
</html>
